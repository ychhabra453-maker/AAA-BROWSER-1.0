name: Build & Release AAA Browser APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: android
      KEY_PASSWORD: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install SDK 36 / 36.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and Signing Keystores (Debug & Release)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AAA Browser,O=AAA Browser,C=IN"
          fi

      - name: Build Debug & Release APKs with Gradle
        run: |
          gradle assembleDebug assembleRelease --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AAA-Browser-debug.apk
          cp app/build/outputs/apk/release/app-release.apk AAA-Browser-release.apk

      - name: Upload AAA Browser APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Browser-apks
          path: |
            AAA-Browser-release.apk
            AAA-Browser-debug.apk

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "AAA Browser v1.1.${{ github.run_number }}"
          body: |
            ### AAA Browser v1.1 — Privacy, Dark Mode & Ad-Free YouTube Audio Browser (Android Auto Ready)
            - **Direct APK Downloads:**
              - `AAA-Browser-release.apk` (Signed Release APK)
              - `AAA-Browser-debug.apk` (Signed Debug APK)
            - **What's New in v1.1:**
              - Pitch-Black AMOLED (`#000000`) & Material 3 Expressive Segmented UI
              - **YouTube Ad-Free Audio-Only Music Mode** (Play music with 0 ads and hidden video in Browser & Android Auto)
              - **Distraction-Free Reader Mode** & **Live Search Suggestions**
              - **Cute Page Info (`i`) Circle Button** (with Find in Page, Text Zoom & Clean URL Share) & **Far-Left Home Button**
              - **In-App OTA System Update Center** in Settings
              - **Pinned Bookmarks:** `www.youtube.com`, `www.google.com`, `www.netflix.com`, `Android Auto settings`
            - **Made by Yug Chhabra In India With❤️**
          files: |
            AAA-Browser-release.apk
            AAA-Browser-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
